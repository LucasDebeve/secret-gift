services:
  secret-gift:
    build: .
    container_name: secret-gift
    restart: unless-stopped
    environment:
      # Adresse publique exacte (obligatoire pour les formulaires SvelteKit)
      ORIGIN: ${ORIGIN:-https://tirage.example.com}
    volumes:
      # Volume nommé : Docker lui donne les bons droits (utilisateur node)
      - secret-gift-data:/data
    networks:
      - caddy

volumes:
  secret-gift-data:

networks:
  caddy:
    # Réseau Docker sur lequel tourne déjà ton conteneur Caddy
    external: true
    name: ${CADDY_NETWORK:-caddy}
